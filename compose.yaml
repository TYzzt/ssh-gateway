services:
  sshmcp:
    build: .
    image: ghcr.io/sshmcp/sshmcp:local
    restart: unless-stopped
    # Explicit container bind; the published host port remains loopback-only below.
    command: ["serve", "--listen", "0.0.0.0:8765"]
    environment:
      SSHMCP_CONFIG_PATH: /config/profiles.yaml
      SSHMCP_MCP_TOKEN: ${SSHMCP_MCP_TOKEN:?set SSHMCP_MCP_TOKEN}
    volumes:
      # Profile management needs this directory writable for atomic YAML replacement.
      - ./config:/config
      - ./keys:/keys:ro
      - ./data:/data
    ports:
      - "127.0.0.1:8765:8765"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
