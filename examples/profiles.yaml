# Preferred YAML config format.
approval:
  enabled: true
  ttl_seconds: 300
  storage:
    type: sqlite
    path: /data/approvals.db
  grants:
    max_ttl_seconds: 3600
    default_max_uses: 20
    high: { task: true, time: false }
    critical: { task: false, time: false }

# This file shows both supported transport styles:
# 1. direct SSH with gateway-managed bastion auth
# 2. delegated via_profile reuse

profiles:
  - name: direct-with-bastion
    description: Production host reached through the managed bastion chain
    target:
      host: target.internal
      user: root
      port: 22
      auth:
        type: password
        password: target-password
    bastions:
      - host: bastion.example.com
        user: root
        port: 22
        auth:
          type: key
          key_path: ~/.ssh/id_ed25519
          passphrase: optional-key-passphrase
    remote:
      shell: bash -lc
    agent:
      manage: true
      remote_path: /tmp/ssh-gatewayd
      version: 0.1.1
    bootstrap:
      enabled: true
      remote_temp_dir: /tmp
    timeouts:
      exec_seconds: 600
      idle_session_seconds: 900
    keepalive:
      interval_seconds: 30
      count_max: 3
    agent_policy:
      capabilities:
        exec: true
        read: true
        write: true
        upload: true
        download: true
        tunnel: false
      allowed_read_paths:
        - /home
        - /var/log
        - /etc/nginx
      allowed_write_paths:
        - /home
      # Agent exec is exact-match allowlisted; shell blacklist parsing is not safe.
      allowed_commands:
        - docker ps
        - systemctl status nginx

  - name: upstream-bastion
    target:
      host: bastion.example.com
      user: root
      port: 22
      auth:
        type: key
        key_path: ~/.ssh/id_ed25519
        passphrase: optional-key-passphrase
    remote:
      shell: bash -lc

  - name: delegated-target
    via_profile: upstream-bastion
    target:
      host: target.internal
      user: root
      port: 22
    remote:
      shell: bash -lc

mcp:
  listen: 127.0.0.1:8765
  auth:
    type: bearer
    token_env: SSH_GATEWAY_MCP_TOKEN
  # Optional. Required for MCP propose_plan and task-scoped grants.
  task_id_env: SSH_GATEWAY_TASK_ID
  # Required only for MCP upload_file/download_file. Keep it narrowly scoped.
  local_file_root: /data
  # Add the public HTTPS origin here when a browser-originating MCP client sends Origin.
  allowed_origins: []
